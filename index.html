<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive heart failure learning website with connected modules, clinical tools, case questions, and UK female text-to-speech for every learning block.">
  <meta name="theme-color" content="#123b5d">
  <title>HF Studio | Interactive Heart Failure</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Course navigation">
      <div class="brand-block">
        <a class="brand" href="#overview" data-route="overview" aria-label="HF Studio home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img">
              <path d="M24 42S6.8 31.9 6.8 18.3C6.8 11.8 11.2 7 17.1 7c3.4 0 5.8 1.5 6.9 3.5C25.1 8.5 27.5 7 30.9 7c5.9 0 10.3 4.8 10.3 11.3C41.2 31.9 24 42 24 42Z" fill="currentColor" opacity=".18"/>
              <path d="M7 25h8l3-8 5 16 5-12 3 6h10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>
            <strong>HF Studio</strong>
            <small>Interactive cardiology chapter</small>
          </span>
        </a>
        <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Close navigation">×</button>
      </div>

      <nav class="course-nav" id="course-nav">
        <p class="nav-eyebrow">Connected study map</p>
        <button class="nav-item is-active" data-route="overview" type="button"><span class="nav-icon">01</span><span><strong>Overview</strong><small>Chapter map & core model</small></span></button>
        <button class="nav-item" data-route="foundations" type="button"><span class="nav-icon">02</span><span><strong>Foundations</strong><small>Definition, EF, stages, NYHA</small></span></button>
        <button class="nav-item" data-route="mechanisms" type="button"><span class="nav-icon">03</span><span><strong>Causes & mechanisms</strong><small>Etiology, RAAS, remodeling</small></span></button>
        <button class="nav-item" data-route="clinical" type="button"><span class="nav-icon">04</span><span><strong>Clinical assessment</strong><small>Left/right, wet/cold, signs</small></span></button>
        <button class="nav-item" data-route="diagnosis" type="button"><span class="nav-icon">05</span><span><strong>Diagnosis</strong><small>ECG, BNP, echo, differential</small></span></button>
        <button class="nav-item" data-route="chronic" type="button"><span class="nav-icon">06</span><span><strong>Chronic management</strong><small>Four pillars, devices, HFpEF</small></span></button>
        <button class="nav-item" data-route="pharmacology" type="button"><span class="nav-icon">07</span><span><strong>Focused pharmacology</strong><small>Diuretics, digoxin, safety</small></span></button>
        <button class="nav-item" data-route="acute" type="button"><span class="nav-icon">08</span><span><strong>Acute heart failure</strong><small>Profiles, stabilization, shock</small></span></button>
        <button class="nav-item" data-route="advanced" type="button"><span class="nav-icon">09</span><span><strong>Advanced HF</strong><small>Devices, support, palliative</small></span></button>
        <button class="nav-item nav-item-tool" data-route="revision" type="button"><span class="nav-icon">↺</span><span><strong>Revision lab</strong><small>Comparisons, flashcards, traps</small></span></button>
        <button class="nav-item nav-item-tool" data-route="cases" type="button"><span class="nav-icon">?</span><span><strong>Clinical cases</strong><small>Case-based questions</small></span></button>
        <button class="nav-item nav-item-tool" data-route="sources" type="button"><span class="nav-icon">§</span><span><strong>Sources & notes</strong><small>Chapter PDF, references, TTS</small></span></button>
      </nav>

      <div class="sidebar-progress" aria-label="Course progress">
        <div><span>Visited modules</span><strong id="progress-label">1 / 12</strong></div>
        <div class="progress-track" aria-hidden="true"><span id="progress-bar" style="width:8.33%"></span></div>
        <button class="text-button" id="reset-progress" type="button">Reset progress</button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="topbar-title"><span class="status-dot" aria-hidden="true"></span><span id="current-section-label">Overview</span></div>
        <div class="topbar-actions">
          <label class="search-box" for="site-search"><span aria-hidden="true">⌕</span><input id="site-search" type="search" placeholder="Search the chapter" autocomplete="off"><kbd>/</kbd></label>
          <div class="voice-pill" id="voice-pill" title="Text-to-speech voice"><span aria-hidden="true">◉</span><span id="voice-status">Loading UK voice…</span></div>
          <label class="rate-control" for="speech-rate" title="Speech speed"><span>Speed</span><select id="speech-rate"><option value="0.85">0.85×</option><option value="0.95" selected>0.95×</option><option value="1">1×</option><option value="1.1">1.1×</option><option value="1.2">1.2×</option></select></label>
          <button class="icon-button" id="stop-speech" type="button" aria-label="Stop speech" title="Stop speech">■</button>
          <button class="icon-button" id="print-button" type="button" aria-label="Print current module" title="Print current module">⎙</button>
        </div>
        <div class="search-results" id="search-results" role="listbox" aria-label="Search results" hidden></div>
      </header>

      <main id="main-content" tabindex="-1">
        <div id="app-content" aria-live="polite"></div>
      </main>

      <footer class="site-footer">
        <p><strong>HF Studio</strong> is an educational study aid, not a substitute for patient-specific assessment or complete current guidelines.</p>
        <button class="text-button" data-route="sources" type="button">Review sources and limitations</button>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
